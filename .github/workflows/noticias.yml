# Cada 30 minutos junta titulares de mercados y cripto y los publica
# en la rama "datos" (noticias.json), que el panel lee desde raw.githubusercontent.com.
name: Noticias

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: true

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Juntar titulares
        run: python3 scripts/noticias.py salida/noticias.json

      - name: Publicar en la rama datos
        working-directory: salida
        run: |
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -q -m "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
